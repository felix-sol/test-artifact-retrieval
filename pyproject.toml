[build-system]
requires = ["setuptools>=68"] 
build-backend = "setuptools.build_meta"

[project]
name = "test-artifact-retrieval"

requires-python = ">=3.10"
authors = [
    {name = "Felix Soltau"}  
] 
description = "Chatbot for Retrieval of Test Artifacts"
readme = "Readme.md"
version = "0.1.0"
[tool.setuptools.packages.find]
where = ["src"] 
include = ["artifact_retrieval*"] 

[tool.fastapi]
entrypoint = "artifact_retrieval.application.backend.main:app"

